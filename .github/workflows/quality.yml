name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Ruff Lint
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install mypy types-requests
      - name: MyPy
        run: mypy --ignore-missing-imports --no-error-summary . || true

  bandit:
    name: Security Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install bandit
      - name: Bandit Security Scan
        run: bandit -r . -f json -o bandit-report.json || true
      - name: Bandit Summary
        run: bandit -r . -ll
